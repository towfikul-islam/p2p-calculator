<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2PCalculator — USD to BDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary-color: #006A4E; /* Deep Green */
    --primary-light: #E6F0ED;
    --accent-color: #F59E0B; /* Vibrant Amber/Gold */
    --accent-light: #FEF3C7;
    --bg-color: #F3F4F6;
    --card-bg: #FFFFFF;
    --text-main: #111827;
    --text-muted: #6B7280;
    --border-color: #E5E7EB;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .calculator-container {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  /* --- HERO SECTION --- */
  .hero {
    background: linear-gradient(135deg, #006A4E 0%, #004D38 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
    position: relative;
  }

  .live-rate {
    font-size: 3rem;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .live-rate span { font-size: 1.5rem; opacity: 0.8; font-weight: 500; }

  .hero-label {
    display: inline-block;
    margin-top: 2px;
    font-size: 0.5rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 2px 6px;
  }

  /* --- CALCULATOR BODY --- */
  .calc-body { padding: 30px 20px; }

  .input-group { margin-bottom: 24px; }

  .input-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .currency-symbol {
    position: absolute;
    left: 16px;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  input[type="number"] {
    width: 100%;
    background: var(--bg-color);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 16px 16px 16px 45px;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-main);
    transition: all 0.2s ease;
    font-family: inherit;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--primary-color);
    background: white;
    box-shadow: 0 0 0 4px var(--primary-light);
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] { -moz-appearance: textfield; }

  /* --- BREAKDOWN SECTION --- */
  .breakdown {
    background: var(--bg-color);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    border: 1px dashed var(--border-color);
  }

  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.875rem;
    margin-bottom: 12px;
  }

  .breakdown-row:last-child { margin-bottom: 0; }

  .breakdown-label { color: var(--text-muted); font-weight: 500; }
  .breakdown-value { font-weight: 600; color: var(--text-main); }

  .highlight-row {
    background: var(--accent-light);
    margin: -8px;
    padding: 8px;
    border-radius: 6px;
  }

  .highlight-row .breakdown-label { color: #B45309; font-weight: 600; }
  .highlight-row .breakdown-value { color: #B45309; font-weight: 700; }

  /* --- FOOTER --- */
  .footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="calculator-container">
  
  <!-- HERO: Shows the prominent boosted rate -->
  <div class="hero">
    <div class="hero-label">USD → BDT</div>
    <div class="live-rate" id="display-rate">0.00 <span>৳</span></div>
  </div>

  <!-- CALCULATOR -->
  <div class="calc-body">
    
    <!-- USD Input -->
    <div class="input-group">
      <label for="usd-input">You Send (USD)</label>
      <div class="input-wrapper">
        <span class="currency-symbol">$</span>
        <input type="number" id="usd-input" value="1" min="1" step="any" placeholder="0.00">
      </div>
    </div>

    <!-- Breakdown (Read-Only) -->
    <div class="breakdown">
      <div class="breakdown-row">
        <span class="breakdown-label">Base Market Rate (<span id="market-rate-label">0</span> ৳)</span>
        <span class="breakdown-value"><span id="base-out">0.00</span> ৳</span>
      </div>
      <div class="breakdown-row highlight-row">
        <span class="breakdown-label">+ 2.5% Govt Incentive</span>
        <span class="breakdown-value">+ <span id="incentive-out">0.00</span> ৳</span>
      </div>
    </div>

    <!-- BDT Total Input -->
    <div class="input-group" style="margin-bottom: 20px;">
      <label for="bdt-input">Recipient Gets Total (BDT)</label>
      <div class="input-wrapper">
        <span class="currency-symbol">৳</span>
        <input type="number" id="bdt-input" placeholder="0.00" style="color: var(--primary-color);">
      </div>
    </div>

    <!-- Footer disclaimer -->
    <div class="footer">
      Rates are indicative. Bangladesh Bank 2.5% remittance incentive applied automatically to legal channel transfers.
    </div>

  </div>
</div>

<script>
  // Setup standard rates
  const MOCK_RATE = {
    market: 121.90,
    incentive: 0.025
  };

  const DOM = {
    usdInput: document.getElementById('usd-input'),
    bdtInput: document.getElementById('bdt-input'),
    baseOut: document.getElementById('base-out'),
    incentiveOut: document.getElementById('incentive-out'),
    displayRate: document.getElementById('display-rate'),
    marketLabel: document.getElementById('market-rate-label')
  };

  let isUpdating = false;

  function init() {
    // Calculate and display the top hero rate once
    const boostedRate = MOCK_RATE.market * (1 + MOCK_RATE.incentive);
    DOM.displayRate.innerHTML = `${boostedRate.toFixed(2)} <span>৳</span>`;
    DOM.marketLabel.textContent = MOCK_RATE.market.toFixed(2);
    
    // Initial calculation based on default USD value
    calculate('usd');

    // Event Listeners for bidirectional binding
    DOM.usdInput.addEventListener('input', () => calculate('usd'));
    DOM.bdtInput.addEventListener('input', () => calculate('bdt'));
  }

  function formatNumber(num) {
    return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calculate(source) {
    if (isUpdating) return;
    isUpdating = true;

    const market = MOCK_RATE.market;
    const incentiveRate = MOCK_RATE.incentive;
    const totalMultiplier = market * (1 + incentiveRate);

    let usd = parseFloat(DOM.usdInput.value);
    let bdt = parseFloat(DOM.bdtInput.value);

    // Handle empty or invalid inputs gracefully
    if (source === 'usd' && isNaN(usd)) { usd = 0; }
    if (source === 'bdt' && isNaN(bdt)) { bdt = 0; }

    let baseBdt = 0;
    let incentiveBdt = 0;

    if (source === 'usd') {
      // Forward calculation
      baseBdt = usd * market;
      incentiveBdt = baseBdt * incentiveRate;
      bdt = baseBdt + incentiveBdt;
      
      DOM.bdtInput.value = usd === 0 ? '' : bdt.toFixed(2);
    } else if (source === 'bdt') {
      // Backward calculation
      usd = bdt / totalMultiplier;
      baseBdt = usd * market;
      incentiveBdt = baseBdt * incentiveRate;

      DOM.usdInput.value = bdt === 0 ? '' : usd.toFixed(2);
    }

    // Update the visual breakdown
    DOM.baseOut.textContent = formatNumber(baseBdt);
    DOM.incentiveOut.textContent = formatNumber(incentiveBdt);

    isUpdating = false;
  }

  // Run on load
  init();
</script>
</body>
</html>
